<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawah - Digital Curator</title>
    <!-- The paths are updated to point into the 'templates' folder -->
    <link rel="stylesheet" href="templates/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fcf9ee;
            color: #1c1c15;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-family: 'Noto Serif', serif;
            font-size: 3rem;
            font-weight: 700;
        }
        p {
            font-size: 1.1rem;
            color: #524438;
            margin-bottom: 2rem;
        }
        .button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #884e08;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #6b3b00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sawah</h1>
        <p>The Digital Curator for exploring the rich tapestry of human history.</p>
        <a href="templates/map.html" class="button">Explore the Map</a>
    </div>
</body>
</html>
